<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de Tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Nuestros Productos</h1>
        
        <!-- Contenedor principal de la galería -->
        <div class="galeria">
            
            <!-- Tarjeta 1 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/200" alt="Producto 1">
                <h2>Auriculares</h2>
                <p class="precio">$ 5.500</p>
                <button>Comprar</button>
            </div>

            <!-- Tarjeta 2 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/200" alt="Producto 2">
                <h2>Teclado Mecánico</h2>
                <p class="precio">$ 12.000</p>
                <button>Comprar</button>
            </div>

            <!-- Tarjeta 3 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/200" alt="Producto 3">
                <h2>Mouse Gamer</h2>
                <p class="precio">$ 3.200</p>
                <button>Comprar</button>
            </div>

            <!-- Tarjeta 4 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/200" alt="Producto 4">
                <h2>Monitor 24"</h2>
                <p class="precio">$ 45.000</p>
                <button>Comprar</button>
            </div>

            <!-- Tarjeta 5 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/200" alt="Producto 5">
                <h2>Silla Ergonómica</h2>
                <p class="precio">$ 85.000</p>
                <button>Comprar</button>
            </div>

            <!-- Tarjeta 6 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/200" alt="Producto 6">
                <h2>Mousepad XXL</h2>
                <p class="precio">$ 2.500</p>
                <button>Comprar</button>
            </div>

        </div>
    </main>
</body>
</html>
