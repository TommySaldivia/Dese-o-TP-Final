<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12 - Posicionamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Posicionamiento en CSS</h1>
        <p>Haz scroll hacia abajo para ver el botón flotante en acción.</p>
        
        <!-- Contenedor del Tooltip -->
        <!-- Este contenedor debe tener position: relative -->
        <div class="contenedor-tooltip">
            <span class="texto-interactivo">Pasa el mouse por encima de este texto</span>
            
            <!-- Este es el tooltip oculto que tendrá position: absolute -->
            <div class="tooltip">¡Hola! Soy un tooltip flotante.</div>
        </div>

        <!-- Contenido extra falso para forzar el scroll de la página -->
        <div class="contenido-largo">
            <h2>Sigue bajando...</h2>
            <!-- Usamos varios saltos de línea para empujar el contenido y generar scroll -->
            <br><br><br><br><br><br><br><br><br><br>
            <br><br><br><br><br><br><br><br><br><br>
            <h2>¡Casi llegas al final!</h2>
            <br><br><br><br><br><br><br><br><br><br>
            <br><br><br><br><br><br><br><br><br><br>
            <p>Fin del contenido.</p>
        </div>

        <!-- Botón para volver arriba -->
        <!-- El href="#" nos lleva al principio de la página nativamente -->
        <a href="#" class="btn-volver-arriba">Volver arriba ⬆</a>
    </main>
</body>
</html>
