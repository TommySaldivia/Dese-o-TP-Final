<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Layout con CSS Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Contenedor principal que será nuestro Grid -->
    <div class="grid-container">
        
        <header class="header">
            <h2>Encabezado del Sitio</h2>
        </header>
        
        <aside class="sidebar">
            <h3>Barra Lateral</h3>
            <ul>
                <li>Opción 1</li>
                <li>Opción 2</li>
                <li>Opción 3</li>
            </ul>
        </aside>
        
        <main class="main-content">
            <h2>Contenido Principal</h2>
            <p>Este es el área principal donde va la información del sitio.</p>
            <p>Usando CSS Grid podemos ubicar esta sección exactamente donde queremos.</p>
        </main>
        
        <footer class="footer">
            <p>Pie de página - Copyright © 2026</p>
        </footer>

    </div>

</body>
</html>
