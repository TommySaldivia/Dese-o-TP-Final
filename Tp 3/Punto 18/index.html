<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Galería Mosaico Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Galería de Imágenes (Masonry)</h1>
        
        <div class="galeria-mosaico">
            <!-- Elemento estándar -->
            <div class="item"><img src="https://via.placeholder.com/400?text=1" alt="Img 1"></div>
            
            <!-- Requisito: Elemento que ocupa 2 columnas y 2 filas -->
            <div class="item destacado"><img src="https://via.placeholder.com/800?text=2+(Destacado)" alt="Img 2"></div>
            
            <!-- Elementos de tamaños variables para forzar a Grid a rellenar huecos -->
            <div class="item alto"><img src="https://via.placeholder.com/400x800?text=3+(Alto)" alt="Img 3"></div>
            <div class="item"><img src="https://via.placeholder.com/400?text=4" alt="Img 4"></div>
            <div class="item ancho"><img src="https://via.placeholder.com/800x400?text=5+(Ancho)" alt="Img 5"></div>
            <div class="item"><img src="https://via.placeholder.com/400?text=6" alt="Img 6"></div>
            <div class="item"><img src="https://via.placeholder.com/400?text=7" alt="Img 7"></div>
            <div class="item alto"><img src="https://via.placeholder.com/400x800?text=8+(Alto)" alt="Img 8"></div>
            <div class="item"><img src="https://via.placeholder.com/400?text=9" alt="Img 9"></div>
        </div>
    </main>
</body>
</html>
