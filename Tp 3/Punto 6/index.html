<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Selectores CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Elemento con ID -->
    <div id="contenedor-principal">
        <p>Bienvenido al ejercicio de selectores. Aquí hay un <span class="resaltado">texto importante</span>.</p>
        
        <!-- Elementos con Clase -->
        <div class="card">
            <p>Este es un párrafo dentro de una tarjeta.</p>
            <span>Información extra de la tarjeta.</span>
        </div>

        <div class="card">
            <p>Otro párrafo en la segunda tarjeta, también con <span class="resaltado">texto importante</span>.</p>
        </div>
    </div>
</body>
